{% extends "layout.html" %}
{% block title %}Hotel Registration{% endblock %}
{% block content %}
<div class="narrow mt-4">
  <h1 class="h3 fw-bold">Register your hotel</h1>
  <p class="text-muted">Hotel ID registration ke baad automatically milegi. Login ke liye role <b>H</b> select karna. Phone numbers login ke baad Profile page se add kar sakte ho.</p>
  <div class="panel">
    <form method="post" action="/hotel/register" class="row g-3">
      <div class="col-12"><label class="form-label" for="hotel_name">Hotel name</label>
        <input type="text" class="form-control" id="hotel_name" name="hotel_name" maxlength="100" required></div>
      <div class="col-md-6"><label class="form-label" for="opening_time">Opening time</label>
        <input type="time" class="form-control" id="opening_time" name="opening_time" required></div>
      <div class="col-md-6"><label class="form-label" for="closing_time">Closing time</label>
        <input type="time" class="form-control" id="closing_time" name="closing_time" required></div>
      <div class="col-md-8"><label class="form-label" for="street">Street</label>
        <input type="text" class="form-control" id="street" name="street" maxlength="100" required></div>
      <div class="col-md-4"><label class="form-label" for="city">City</label>
        <input type="text" class="form-control" id="city" name="city" maxlength="50" required></div>
      <div class="col-md-4"><label class="form-label" for="pin_code">PIN code</label>
        <input type="number" class="form-control" id="pin_code" name="pin_code" required></div>
      <div class="col-md-4"><label class="form-label" for="geo_lat">Latitude</label>
        <input type="number" step="0.00000001" class="form-control" id="geo_lat" name="geo_lat"></div>
      <div class="col-md-4"><label class="form-label" for="geo_long">Longitude</label>
        <input type="number" step="0.00000001" class="form-control" id="geo_long" name="geo_long"></div>
      <div class="col-md-6"><label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-md-6"><label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-12"><button class="btn btn-main" type="submit">Register hotel</button></div>
    </form>
  </div>
</div>
{% endblock %}
