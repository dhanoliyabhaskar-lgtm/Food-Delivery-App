{% extends "layout.html" %}
{% block title %}Customer Registration{% endblock %}
{% block content %}
<div class="narrow mt-4">
  <h1 class="h3 fw-bold">Create your customer account</h1>
  <p class="text-muted">Account banne ke baad aapko Customer ID milegi. Login ke liye role <b>U</b> select karna.</p>
  <div class="panel">
    <form method="post" action="/user/register" class="row g-3">
      <div class="col-md-6"><label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" maxlength="100" required></div>
      <div class="col-md-6"><label class="form-label" for="phone_number">Phone number</label>
        <input type="number" class="form-control" id="phone_number" name="phone_number" placeholder="10-digit mobile number" required></div>
      <div class="col-md-6"><label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-md-6"><label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-12"><button class="btn btn-main" type="submit">Create account</button></div>
    </form>
  </div>
</div>
{% endblock %}
