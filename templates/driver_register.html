{% extends "layout.html" %}
{% block title %}Driver Registration{% endblock %}
{% block content %}
<div class="narrow mt-4">
  <h1 class="h3 fw-bold">Register as a delivery partner</h1>
  <p class="text-muted">Driver ID registration ke baad automatically milegi. Login ke liye role <b>D</b> select karna.</p>
  <div class="panel">
    <form method="post" action="/driver/register" class="row g-3">
      <div class="col-md-6"><label class="form-label" for="name">Name</label>
        <input type="text" class="form-control" id="name" name="name" maxlength="100" required></div>
      <div class="col-md-6"><label class="form-label" for="contact_no">Contact number</label>
        <input type="tel" class="form-control" id="contact_no" name="contact_no" maxlength="15" required></div>
      <div class="col-md-6"><label class="form-label" for="vehicle_no">Vehicle number</label>
        <input type="text" class="form-control" id="vehicle_no" name="vehicle_no" maxlength="20" required></div>
      <div class="col-md-6"><label class="form-label" for="current_city">Your city</label>
        <input type="text" class="form-control" id="current_city" name="current_city" maxlength="50" required></div>
      <div class="col-md-6"><label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-md-6"><label class="form-label" for="confirm_password">Confirm password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" autocomplete="new-password" required></div>
      <div class="col-12"><button class="btn btn-main" type="submit">Register</button></div>
    </form>
  </div>
</div>
{% endblock %}
